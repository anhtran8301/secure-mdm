spring.application.name=secure-mdm
server.port=${SERVER_PORT:8080}

spring.r2dbc.url=r2dbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:secure_mdm}
spring.r2dbc.username=${DB_USERNAME:secure_mdm}
spring.r2dbc.password=${DB_PASSWORD}
spring.r2dbc.pool.enabled=true

spring.liquibase.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:secure_mdm}
spring.liquibase.user=${DB_USERNAME:secure_mdm}
spring.liquibase.password=${DB_PASSWORD}
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/changelog-master.xml

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.packages-to-scan=com.anhtran.secure_mdm

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
