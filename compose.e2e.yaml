name: secure-mdm-e2e
services:
  mysql:
    image: mysql:8.4
    ports: ['127.0.0.1:3308:3306']
    environment:
      MYSQL_DATABASE: secure_mdm
      MYSQL_USER: secure_mdm
      MYSQL_PASSWORD: ${DB_PASSWORD:?Generate .local/e2e first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Generate .local/e2e first}
    tmpfs: /var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1",
        ]
      interval: 3s
      timeout: 5s
      retries: 40
